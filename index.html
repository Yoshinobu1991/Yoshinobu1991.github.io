        const grid = document.getElementById('product-grid');
        const filterContainer = document.getElementById('filter-container');
        
        const mainCharacters = ["Eleven", "Steve", "Dustin", "Mike", "Lucas", "Will", "Max", "Hopper", "Joyce", "Robin", "Eddie", "Vecna", "Demogorgon", "Erica", "Nancy", "Jonathan"];
        
        inventory.forEach(item => {
            item.tags = [];
            mainCharacters.forEach(char => {
                if(item.name.toLowerCase().includes(char.toLowerCase()) || item.name.includes(char)) {
                    item.tags.push(char);
                }
            });
            
            if(item.name.includes('?狩?Ｘ香??) || item.name.includes('8-Bit')) {
                item.tags.push("Dustin", "Lucas", "Mike", "Will");
            }
            if(item.name.includes('Robin & Steve')) {
                item.tags.push("Robin", "Steve");
            }
            if(item.name.includes('Vecna')) {
                item.tags.push("Vecna");
            }
            
            if(item.tags.length === 0) item.tags.push("Other");
            item.tags = [...new Set(item.tags)];
        });

        const foundCharacters = new Set();
        inventory.forEach(item => item.tags.forEach(t => foundCharacters.add(t)));
        
        const sortedChars = Array.from(foundCharacters).sort();
        sortedChars.forEach(char => {
            if(char === 'Other') return;
            const btn = document.createElement('button');
            btn.className = 'filter-btn text-left px-3 py-2 rounded border border-gray-800 bg-gray-900/50 text-gray-400 hover:border-red-900 hover:text-red-300 transition';
            btn.setAttribute('data-char', char);
            const count = inventory.filter(i => i.tags.includes(char)).length;
            btn.innerText = `${char} (${count})`;
            btn.onclick = () => filterProducts(char, btn);
            filterContainer.appendChild(btn);
        });
        
        if(foundCharacters.has('Other')) {
            const btn = document.createElement('button');
            btn.className = 'filter-btn text-left px-3 py-2 rounded border border-gray-800 bg-gray-900/50 text-gray-400 hover:border-red-900 hover:text-red-300 transition';
            btn.setAttribute('data-char', 'Other');
            const count = inventory.filter(i => i.tags.includes('Other')).length;
            btn.innerText = `?嗡?閫 (${count})`;
            btn.onclick = () => filterProducts('Other', btn);
            filterContainer.appendChild(btn);
        }

        function filterProducts(selectedChar, clickedBtn) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.style.backgroundColor = '';
                btn.style.color = '';
            });
            
            const physBtn = document.getElementById('show-physical-btn');
            if(physBtn) {
                physBtn.classList.remove('active');
                physBtn.style.backgroundColor = '';
                physBtn.style.color = '';
            }

            clickedBtn.classList.add('active');
            renderGrid(selectedChar);
        }

        document.querySelector('[data-char="All"]').onclick = function() {
            filterProducts('All', this);
        };

        function renderGrid(filterChar) {
            grid.innerHTML = '';
            const filtered = filterChar === 'All' 
                ? inventory 
                : inventory.filter(item => item.tags.includes(filterChar));
            
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card bg-gray-900 rounded-lg overflow-hidden flex flex-col group';
                
                let badgeColor = 'bg-gray-700 text-gray-300';
                if(item.category.includes('畾踹?')) badgeColor = 'bg-yellow-600 text-white shadow-[0_0_10px_rgba(202,138,4,0.8)]';
                else if(item.category.includes('憭批?')) badgeColor = 'bg-green-700 text-white shadow-[0_0_10px_rgba(21,128,61,0.8)]';
                else if(item.category.includes('撣貉?')) badgeColor = 'bg-blue-800 text-white';
                
                card.innerHTML = `
                    <div class="relative pt-[100%] bg-white/90 group-hover:bg-white transition-colors duration-300">
                        <div class="absolute inset-0 w-full h-full">
                            <img src="${item.img}" onerror="this.src='https://via.placeholder.com/300x300?text=??敺?'" class="absolute inset-0 w-full h-full object-contain p-4 drop-shadow-xl ${item.sold ? 'grayscale opacity-40' : ''}">
                            ${item.sold ? '<div class="absolute inset-0 flex items-center justify-center z-10"><span class="bg-red-700/90 text-white font-bold py-2 px-6 rounded transform -rotate-12 border-2 border-white/80 shadow-2xl text-2xl tracking-widest backdrop-blur-sm pointer-events-none">SOLD OUT</span></div>' : ''}
                        </div>
                        <span class="absolute top-2 left-2 ${badgeColor} text-xs px-2 py-1 rounded font-bold border border-white/20">${item.number}</span>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between border-t border-red-900/30">
                        <h3 class="text-sm font-semibold text-gray-200 mb-2 leading-tight group-hover:text-red-400 transition-colors">${item.name}</h3>
                        <div class="flex justify-between items-end mt-3">
                            <span class="text-xs text-gray-500">${item.category.replace(/[?????]/g, '').trim()}</span>
                            <span class="text-xl font-black text-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.5)]">$${item.price}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderGrid('All');
    
        document.getElementById('show-physical-btn').onclick = function() {

                btn.style.color = '';
            });
            this.classList.add('active');
            this.style.backgroundColor = '#7f1d1d';
            this.style.color = '#fca5a5';
            
            grid.innerHTML = '';
            const images = ['group1.jpg', 'group2.jpg', 'group3.jpg', 'group4.jpg', 'group5.jpg', 'group6.jpg', 'group7.jpg'];

                card.innerHTML = `<img src="Physical_Group_Shots/${img}" class="w-full h-auto object-cover" />`;
                grid.appendChild(card);
            });
        };
